  <path d="M 90.0 336.3 C 115.4 336.3, 115.4 302.7, 140.8 302.7 C 166.2 302.7, 166.2 271.2, 191.5 271.2 C 216.9 271.2, 216.9 237.6, 242.3 237.6 C 267.7 237.6, 267.7 208.1, 293.1 208.1 C 318.5 208.1, 318.5 259.3, 343.8 259.3 C 369.2 259.3, 369.2 243.6, 394.6 243.6 C 420.0 243.6, 420.0 217.9, 445.4 217.9 C 470.8 217.9, 470.8 188.3, 496.2 188.3 C 521.5 188.3, 521.5 198.2, 546.9 198.2 C 572.3 198.2, 572.3 168.6, 597.7 168.6 C 623.1 168.6, 623.1 144.9, 648.5 144.9 C 673.8 144.9, 673.8 223.8, 699.2 223.8 C 724.6 223.8, 724.6 237.6, 750.0 237.6" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

