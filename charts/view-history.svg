    <!-- Icon -->
    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="none" stroke="#10b981" stroke-width="2.5" transform="scale(0.7) translate(-4, -6)"/>
