    <rect x="12" y="42" width="14" height="14" rx="2" fill="#ea0808ff" stroke="#000000" stroke-width="1.5"/>
    <text x="34" y="54" class="legend-text">VuxDucGiang/VuxDucGiang (Uniques)</text>
  </g>

