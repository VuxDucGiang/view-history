<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    .star-title { font-family: 'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', 'Comic Sans', sans-serif; font-size: 26px; font-weight: 700; fill: #000000; }
    .axis-label { font-family: 'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', 'Comic Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #000000; }
    .legend-text { font-family: 'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', 'Comic Sans', sans-serif; font-size: 14px; font-weight: 600; fill: #000000; }
    .watermark-text { font-family: 'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', 'Comic Sans', sans-serif; font-size: 14px; font-weight: 600; fill: #4b5563; }
  </style>

  <!-- Background Box (Light Theme Star History Style) -->
  <rect width="800" height="500" rx="20" ry="20" fill="#fcfcfc" stroke="#000000" stroke-width="3"/>

  <!-- Centered Title -->
  <text x="400" y="42" class="star-title" text-anchor="middle">View History (6 Months)</text>

  <!-- Y Axis Label (Rotated on the left) -->
  <text x="-247.5" y="32" class="axis-label" text-anchor="middle" transform="rotate(-90)">GitHub Views</text>

  <!-- X Axis Label (Centered at bottom) -->
  <text x="420" y="480" class="axis-label" text-anchor="middle">Month</text>

  <!-- Y Grid & Labels -->
  <g><line x1="84" y1="425" x2="90" y2="425" stroke="#000000" stroke-width="2"/><line x1="90" y1="425" x2="750" y2="425" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="430" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">0</text><line x1="84" y1="354" x2="90" y2="354" stroke="#000000" stroke-width="2"/><line x1="90" y1="354" x2="750" y2="354" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="359" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">6</text><line x1="84" y1="283" x2="90" y2="283" stroke="#000000" stroke-width="2"/><line x1="90" y1="283" x2="750" y2="283" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="288" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">12</text><line x1="84" y1="212" x2="90" y2="212" stroke="#000000" stroke-width="2"/><line x1="90" y1="212" x2="750" y2="212" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="217" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">18</text><line x1="84" y1="141" x2="90" y2="141" stroke="#000000" stroke-width="2"/><line x1="90" y1="141" x2="750" y2="141" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="146" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">24</text><line x1="84" y1="70" x2="90" y2="70" stroke="#000000" stroke-width="2"/><line x1="90" y1="70" x2="750" y2="70" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="76" y="75" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="15" font-weight="600" text-anchor="end">30</text></g>

  <!-- X Ticks & Labels (6 Mốc Tháng) -->
  <g><line x1="90" y1="425" x2="90" y2="431" stroke="#000000" stroke-width="2"/><text x="90" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3/2026</text><line x1="222" y1="425" x2="222" y2="431" stroke="#000000" stroke-width="2"/><text x="222" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">4/2026</text><line x1="354" y1="425" x2="354" y2="431" stroke="#000000" stroke-width="2"/><text x="354" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">5/2026</text><line x1="486" y1="425" x2="486" y2="431" stroke="#000000" stroke-width="2"/><text x="486" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">6/2026</text><line x1="618" y1="425" x2="618" y2="431" stroke="#000000" stroke-width="2"/><text x="618" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">7/2026</text><line x1="750" y1="425" x2="750" y2="431" stroke="#000000" stroke-width="2"/><text x="750" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">8/2026</text></g>

  <!-- Main Chart Box Axes (Black Lines) -->
  <polyline points="90,70 90,425 750,425" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Total Views Line (Star-History Blue #3b82f6) -->
  <path d="M 90.0 425.0 C 156.0 425.0, 156.0 425.0, 222.0 425.0 C 288.0 425.0, 288.0 425.0, 354.0 425.0 C 420.0 425.0, 420.0 425.0, 486.0 425.0 C 552.0 425.0, 552.0 425.0, 618.0 425.0 C 684.0 425.0, 684.0 188.3, 750.0 188.3" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Unique Visitors Line (Star-History Red #ea0808) -->
  <path d="M 90.0 425.0 C 156.0 425.0, 156.0 425.0, 222.0 425.0 C 288.0 425.0, 288.0 425.0, 354.0 425.0 C 420.0 425.0, 420.0 425.0, 486.0 425.0 C 552.0 425.0, 552.0 425.0, 618.0 425.0 C 684.0 425.0, 684.0 377.7, 750.0 377.7" fill="none" stroke="#ea0808" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chấm tròn nổi bật cho 6 mốc tháng -->
  <circle cx="90.0" cy="425.0" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/><circle cx="222.0" cy="425.0" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/><circle cx="354.0" cy="425.0" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/><circle cx="486.0" cy="425.0" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/><circle cx="618.0" cy="425.0" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/><circle cx="750.0" cy="188.3" r="4.5" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/>
  <circle cx="90.0" cy="425.0" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/><circle cx="222.0" cy="425.0" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/><circle cx="354.0" cy="425.0" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/><circle cx="486.0" cy="425.0" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/><circle cx="618.0" cy="425.0" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/><circle cx="750.0" cy="377.7" r="4.5" fill="#ea0808" stroke="#000000" stroke-width="1.5"/>

  <!-- Top-Left Legend Box (Star History Signature Style) -->
  <g transform="translate(105, 85)">
    <!-- Legend Container Box -->
    <rect width="358.5" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Item 1: Total Views -->
    <rect x="12" y="14" width="14" height="14" rx="2" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/>
    <text x="34" y="26" class="legend-text">VuxDucGiang/VuxDucGiang (Views)</text>

    <!-- Item 2: Unique Visitors -->
    <rect x="12" y="42" width="14" height="14" rx="2" fill="#ea0808" stroke="#000000" stroke-width="1.5"/>
    <text x="34" y="54" class="legend-text">VuxDucGiang/VuxDucGiang (Uniques)</text>
  </g>

  <!-- Bottom Right Star-History Style Watermark -->
  <g transform="translate(620, 476)">
    <!-- Icon -->
    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="none" stroke="#10b981" stroke-width="2.5" transform="scale(0.7) translate(-4, -6)"/>
    <text x="18" y="10" class="watermark-text">view-history</text>
  </g>
</svg>