" y1="425" x2="750" y2="431" stroke="#000000" stroke-width="2"/><text x="750" y="451" fill="#000000" font-family="'Comic Sans MS', 'Comic Neue', Chalkboard, sans-serif" font-size="14" font-weight="600" text-anchor="middle">8/5</text></g>

