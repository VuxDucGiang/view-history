  <path d="M 90.0 389.5 C 115.4 389.5, 115.4 377.7, 140.8 377.7 C 166.2 377.7, 166.2 365.8, 191.5 365.8 C 216.9 365.8, 216.9 350.1, 242.3 350.1 C 267.7 350.1, 267.7 342.2, 293.1 342.2 C 318.5 342.2, 318.5 363.9, 343.8 363.9 C 369.2 363.9, 369.2 356.0, 394.6 356.0 C 420.0 356.0, 420.0 346.1, 445.4 346.1 C 470.8 346.1, 470.8 330.3, 496.2 330.3 C 521.5 330.3, 521.5 340.2, 546.9 340.2 C 572.3 340.2, 572.3 322.4, 597.7 322.4 C 623.1 322.4, 623.1 310.6, 648.5 310.6 C 673.8 310.6, 673.8 348.1, 699.2 348.1 C 724.6 348.1, 724.6 354.0, 750.0 354.0" fill="none" stroke="#ea0808ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-Left Legend Box (Star History Signature Style) -->
  <g transform="translate(105, 85)">
    <!-- Legend Container Box -->
    <rect width="358.5" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Item 1: Total Views -->
    <rect x="12" y="14" width="14" height="14" rx="2" fill="#3b82f6" stroke="#000000" stroke-width="1.5"/>
    <text x="34" y="26" class="legend-text">VuxDucGiang/VuxDucGiang (Views)</text>

    <!-- Item 2: Unique Visitors -->
    <rect x="12" y="42" width="14" height="14" rx="2" fill="#eab308" stroke="#000000" stroke-width="1.5"/>
    <text x="34" y="54" class="legend-text">VuxDucGiang/VuxDucGiang (Uniques)</text>
  </g>

  <!-- Bottom Right Star-History Style Watermark -->
  <g transform="translate(620, 476)">
    <!-- Icon -->
    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="none" stroke="#10b981" stroke-width="2.5" transform="scale(0.7) translate(-4, -6)"/>
