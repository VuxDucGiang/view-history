name: Update GitHub View History & Charts

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-traffic-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest View Traffic & Generate SVG Chart
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'VuxDucGiang/VuxDucGiang' }}
        run: |
          npm run fetch-views
          npm run generate-svg

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Update traffic view history and SVG chart [skip ci]"
          file_pattern: "data/history.json charts/view-history.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
